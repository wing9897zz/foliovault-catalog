<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FolioVault Catalog</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1116; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #131c24; border: 1px solid #22303c; border-radius: 18px; padding: 24px 28px; max-width: 500px; line-height: 1.6; }
    h2 { margin-top: 0; }
    a { color: #34d399; }
    code { background: #1c2833; padding: 2px 6px; border-radius: 6px; }
    .meta { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>FolioVault 遠端機構目錄</h2>
    <p>此網站為 FolioVault App 提供離線優先的遠端機構與實物資產目錄索引，並按需提供各機構 Logo。</p>
    <p class="meta">目前收錄：104 間機構（銀行、錢包、交易所、券商、支付、保險／退休）與 14 項實物資產。</p>
    <p>目錄 JSON：<a href="./catalog.json"><code>catalog.json</code></a></p>
  </div>
</body>
</html>
